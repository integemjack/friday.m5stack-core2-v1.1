name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.1   # Hub 无 v5.5.0（本机版本），取最近的 patch
    steps:
      - uses: actions/checkout@v4

      - name: Build firmware
        run: |
          . $IDF_PATH/export.sh
          idf.py build

      - name: Merge factory image (16MB 全量镜像)
        run: |
          . $IDF_PATH/export.sh
          python -m esptool --chip esp32 merge_bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            -o build/m5stack-core2-factory-16MB.bin \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0x20000 build/ota_data_initial.bin \
            0x100000 build/m5_friday_voice.bin

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}
          path: |
            build/m5_friday_voice.bin
            build/m5stack-core2-factory-16MB.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            partitions.csv

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware-${{ github.ref_name }}

      - name: Verify tag matches APP_VERSION
        run: |
          ver="${GITHUB_REF_NAME#v}"
          grep -q "#define APP_VERSION \"$ver\"" main/app.h || {
            echo "::error::tag $GITHUB_REF_NAME 与 main/app.h 的 APP_VERSION 不一致"; exit 1; }

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            build/m5_friday_voice.bin \
            build/m5stack-core2-factory-16MB.bin \
            build/bootloader/bootloader.bin \
            build/partition_table/partition-table.bin \
            partitions.csv \
            --title "v$ver" \
            --notes "M5Stack Core2 v1.1 · Friday 语音终端固件 v$ver

          - \`m5_friday_voice.bin\` — app 分区镜像（OTA 用；或 USB 烧到 0x100000）
          - \`m5stack-core2-factory-16MB.bin\` — 16MB 全量出厂镜像（空白机 esptool write_flash 0x0 一次搞定）
          - \`bootloader.bin\` / \`partition-table.bin\` — 分开烧时：0x0 / 0x8000
          - 分区表自 v0.2.0 起改为 OTA 双分区（ota_0/ota_1 各 3MB）：从 factory 布局升级需重烧分区表 + app

          在线设备升级：主界面点顶部状态栏即可（需能直连 GitHub）。"
